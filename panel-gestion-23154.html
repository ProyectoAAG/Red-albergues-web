<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Admin – Red de instalaciones</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
:root{
  --bg:#f4f5f7;
  --card:#ffffff;
  --text:#111827;
  --muted:#6b7280;
  --primary:#2563eb;
  --border:#e5e7eb;
}
.dark{
  --bg:#020617;
  --card:#0f172a;
  --text:#e5e7eb;
  --muted:#9ca3af;
  --primary:#22c55e;
  --border:#1f2937;
}
body{
  margin:0;
  font-family:system-ui,Segoe UI;
  background:var(--bg);
  color:var(--text);
  padding:1rem;
}
.card{
  max-width:700px;
  margin:0 auto 1rem auto;
  background:var(--card);
  border:1px solid var(--border);
  border-radius:14px;
  padding:1rem;
}
h1{font-size:1.3rem;margin-bottom:.4rem}
label{font-size:.75rem;color:var(--muted)}
input,select{
  width:100%;
  padding:.45rem .7rem;
  border-radius:999px;
  border:1px solid var(--border);
  background:transparent;
  color:var(--text);
}
.row{display:flex;gap:.5rem}
.row>div{flex:1}
button{
  border:none;
  border-radius:999px;
  padding:.45rem .9rem;
  cursor:pointer;
}
.primary{background:var(--primary);color:white}
.secondary{background:transparent;border:1px solid var(--border);color:var(--text)}
.small{font-size:.8rem;color:var(--muted)}
.topbar{display:flex;justify-content:flex-end;margin-bottom:.5rem}
</style>
</head>

<body>

<div class="topbar">
  <button id="themeBtn" class="secondary">🌙 Tema</button>
</div>

<div class="card" id="loginCard">
  <h1>Acceso administrador</h1>
  <input id="loginEmail" placeholder="Email">
  <input id="loginPass" type="password" placeholder="Contraseña" style="margin-top:.4rem">
  <button id="loginBtn" class="primary" style="margin-top:.6rem">Entrar</button>
  <div id="loginStatus" class="small"></div>
</div>

<div class="card" id="adminCard" style="display:none">
  <h1>Nueva instalación</h1>

  <label>Nombre</label>
  <input id="nombre">

  <div class="row">
    <div>
      <label>Comunidad</label>
      <input id="comunidad">
    </div>
    <div>
      <label>Provincia</label>
      <input id="provincia">
    </div>
  </div>

  <label>Municipio</label>
  <input id="municipio">

  <label>Dirección</label>
  <input id="direccion">

  <div class="row">
    <div>
      <label>Latitud</label>
      <input id="lat">
    </div>
    <div>
      <label>Longitud</label>
      <input id="lng">
    </div>
  </div>

  <div class="row" style="margin-top:.5rem">
    <button id="geoBtn" class="secondary">📍 Obtener coordenadas</button>
    <button id="geoClear" class="secondary">🧹 Borrar</button>
  </div>

  <div id="geoMsg" class="small"></div>

  <button id="saveBtn" class="primary" style="margin-top:.8rem">Guardar</button>
  <div id="saveMsg" class="small"></div>
</div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<script>
/* FIREBASE */
firebase.initializeApp({
  apiKey: "AIzaSyD_qFTqRsPwHTO9P8nyfikyWSAV1kt7k90",
  authDomain: "red-albergues.firebaseapp.com",
  projectId: "red-albergues"
});
const auth=firebase.auth();
const db=firebase.firestore();

/* THEME */
const html=document.documentElement;
document.getElementById("themeBtn").onclick=()=>{
  html.classList.toggle("dark");
};

/* LOGIN */
loginBtn.onclick=async()=>{
  try{
    await auth.signInWithEmailAndPassword(loginEmail.value,loginPass.value);
  }catch(e){
    loginStatus.textContent=e.message;
  }
};
auth.onAuthStateChanged(u=>{
  loginCard.style.display=u?"none":"block";
  adminCard.style.display=u?"block":"none";
});

/* GEOCODING */
function buildQueries(){
  const d=direccion.value.trim();
  const m=municipio.value.trim();
  const p=provincia.value.trim();
  const c=comunidad.value.trim();
  return [
    [d,m,p,c],
    [m,p,c],
    [m,p],
    [m]
  ].map(a=>a.filter(Boolean).join(", ")).filter(Boolean);
}

async function geocode(q){
  const url=`https://nominatim.openstreetmap.org/search?format=json&limit=1&q=${encodeURIComponent(q)}`;
  const r=await fetch(url);
  const j=await r.json();
  if(!j.length) return null;
  return {lat:j[0].lat,lng:j[0].lon};
}

geoBtn.onclick=async()=>{
  geoMsg.textContent="Buscando…";
  for(const q of buildQueries()){
    const r=await geocode(q);
    if(r){
      lat.value=r.lat;
      lng.value=r.lng;
      geoMsg.textContent="✔ Coordenadas encontradas";
      return;
    }
  }
  geoMsg.textContent="❌ No encontrado, abre OpenStreetMap";
  window.open("https://www.openstreetmap.org/search?query="+encodeURIComponent(municipio.value));
};

geoClear.onclick=()=>{
  lat.value="";lng.value="";geoMsg.textContent="Borradas";
};

/* SAVE */
saveBtn.onclick=async()=>{
  try{
    await db.collection("instalaciones").add({
      nombre:nombre.value,
      comunidad:comunidad.value,
      provincia:provincia.value,
      municipio:municipio.value,
      direccion:direccion.value,
      lat:lat.value?Number(lat.value):null,
      lng:lng.value?Number(lng.value):null,
      creado:firebase.firestore.FieldValue.serverTimestamp()
    });
    saveMsg.textContent="✔ Guardado";
  }catch(e){
    saveMsg.textContent="Error";
  }
};
</script>
</body>
</html>
